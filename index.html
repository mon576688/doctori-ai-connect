    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Doctori AI" />

    <meta property="og:type" content="website" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["MedicalOrganization", "WebApplication"],
          "name": "Doctori AI",
          "url": "https://doctoriai.com",
          "logo": "https://doctoriai.com/pwa-512x512.png",
          "description": "AI-powered health assistant for symptom checking, doctor booking, and health guidance. Available 24/7.",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "Web",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "sameAs": ["https://twitter.com/DoctoriAI"]
        },
        {
          "@type": "WebSite",
          "name": "Doctori AI",
          "url": "https://doctoriai.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://doctoriai.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
